name: Release

# On a version tag: build the skill bundle + latest.json and publish a GitHub
# Release with those assets. The update client (reflexes.update) fetches
# github.com/zentropi-ai/reflexes/releases/latest/download/latest.json, which
# GitHub serves from the latest release's uploaded latest.json asset — so
# publishing the release below is what makes the new version discoverable.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release assets
        run: python scripts/make_release_assets.py --tag "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/reflexes-skill-*.tar.gz
            dist/latest.json

  # Publish the Python package to PyPI via OIDC Trusted Publishing (no API token
  # stored). One-time setup: on PyPI, add a trusted publisher for project
  # `reflexes` → owner `zentropi-ai`, repo `reflexes`, workflow `release.yml`.
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # mint the OIDC token PyPI verifies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Publish the OpenClaw plugin to npm. One-time setup: add an `NPM_TOKEN` repo
  # secret (an npm automation token with publish rights to the @zentropi scope).
  # The package sets publishConfig.access=public for the scoped package.
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # mint the OIDC token npm's trusted publishing verifies
      contents: read
    defaults:
      run:
        working-directory: integrations-ts/openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for OIDC
        run: npm install -g npm@latest
      - name: Install + build + test
        run: |
          npm ci
          npm test
      # No NODE_AUTH_TOKEN: npm uses OIDC (trusted publisher configured on
      # npmjs for @zentropi/reflexes-openclaw). An empty token line is exactly
      # what causes ENEEDAUTH, so it must not be set here.
      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish

