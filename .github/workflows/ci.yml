name: CI

# Runs the test suites on every push to main and every pull request.
# The Python suite runs offline: tests that hit the live Zentropi CoPE
# endpoint are gated on ZENTROPI_API_KEY and skip automatically here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev/otel extras)
        run: pip install -e ".[dev,otel]"
      - name: Run tests
        run: pytest tests/ -q

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations-ts/openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Build + test
        run: npm test
